name: CI

# 每次提交与 PR 都跑：前端类型/格式检查 + 后端 fmt/clippy/build。
# 真正出包的是 build-server / build-agent / docker-images / release 四个 workflow。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: 前端检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: 安装依赖
        working-directory: web
        run: bun install --frozen-lockfile

      - name: biome 检查
        working-directory: web
        run: bun run lint

      - name: 构建（含 tsc 类型检查）
        working-directory: web
        run: bun run build

      # 主控用 rust-embed 把 web/dist 编进二进制，后端 job 直接复用这份产物
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 1
          if-no-files-found: error

  rust:
    name: 后端检查
    runs-on: ubuntu-24.04
    needs: web
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace
