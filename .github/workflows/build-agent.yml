name: 构建客户端

# 产出各平台的 myprobe-agent 单文件。Agent 不含前端资源，所以不需要 bun 那一步。
# 手动触发用于验证，发版时由 release.yml 调用，产物直接进 Release。
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux 一律 musl 静态链接：单文件、不依赖系统 glibc
        include:
          - { name: linux-amd64, target: x86_64-unknown-linux-musl, os: ubuntu-24.04, archive: tar.gz }
          - { name: linux-arm64, target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, archive: tar.gz }
          - { name: macos-amd64, target: x86_64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { name: macos-arm64, target: aarch64-apple-darwin, os: macos-latest, archive: tar.gz }
          - { name: windows-amd64, target: x86_64-pc-windows-msvc, os: windows-latest, archive: zip }
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: agent-${{ matrix.target }}

      - name: 安装 musl 工具链
        if: endsWith(matrix.target, '-musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: 构建
        shell: bash
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked -p myprobe-agent --target ${{ matrix.target }}

      - name: 打包 tar.gz
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          tar -C "target/${{ matrix.target }}/release" -czf \
            "$GITHUB_WORKSPACE/myprobe-agent-${{ matrix.name }}.tar.gz" myprobe-agent

      - name: 打包 zip
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/${{ matrix.target }}/release/myprobe-agent.exe" `
            -DestinationPath "myprobe-agent-${{ matrix.name }}.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: myprobe-agent-${{ matrix.name }}
          path: myprobe-agent-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error
