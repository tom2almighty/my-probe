name: 构建 Docker 镜像

# 每个架构在对应的原生 runner 上单独构建，再用 imagetools 合成多架构清单。
# 比 QEMU 模拟快得多（Rust 编译在模拟器里慢到不可接受）。
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.component }} / ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: server, dockerfile: Dockerfile, arch: amd64, os: ubuntu-24.04 }
          - { component: server, dockerfile: Dockerfile, arch: arm64, os: ubuntu-24.04-arm }
          - { component: agent, dockerfile: Dockerfile.agent, arch: amd64, os: ubuntu-24.04 }
          - { component: agent, dockerfile: Dockerfile.agent, arch: arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v5

      # GHCR 只认小写路径，仓库属主可能带大写
      - name: 计算镜像名
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/myprobe-${{ matrix.component }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 先只按 digest 推上去、不打 tag，tag 留给 manifest job 一次性打
      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          provenance: false
          cache-from: type=gha,scope=${{ matrix.component }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: 导出 digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.component }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  manifest:
    name: 合并 ${{ matrix.component }} 清单
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        component: [server, agent]
    steps:
      - name: 计算镜像名
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/myprobe-${{ matrix.component }}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.component }}-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest 只跟着 v* tag 走，日常推 main 只更新分支名 tag
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: 推送多架构清单
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          refs=""
          for f in /tmp/digests/*; do refs="$refs $IMAGE@$(cat "$f")"; done
          docker buildx imagetools create $tags $refs

      - name: 校验
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"
