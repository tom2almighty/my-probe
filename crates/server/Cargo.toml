[package]
name = "myprobe-server"
version.workspace = true
edition = "2021"

[dependencies]
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["ws", "json"] }
axum-extra = { version = "0.12.6", features = ["typed-header"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
mime_guess = "2.0.5"
myprobe-shared = { path = "../shared" }
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = [
  "json",
  "charset",
  "http2",
  "system-proxy",
  "rustls-no-provider",
] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = "8.12.0"
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# rc: 公开接口的缓存直接把 Arc<T> 交给 Json 序列化，省掉一次深拷贝
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace", "fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
