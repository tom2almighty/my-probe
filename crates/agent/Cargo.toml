[package]
name = "myprobe-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
futures-util = "0.3.34"
myprobe-shared = { path = "../shared" }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
surge-ping = "0.9.0"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
